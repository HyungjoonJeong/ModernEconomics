<script>
(() => {
'use strict';

const byId=new Map(questions.map(q=>[q.id,q]));
const KEY='econ-study-v1',VERSION=1;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({version:VERSION,records:{},bookmarks:[],session:null,flash:null});

// ⚠️ 바로 이 줄이 누락되어 에러가 났던 것입니다! 반드시 있어야 합니다.
let state=fresh(),view='home',listKind='browse',page=1,filter='',search='',installPrompt=null,storageOK=true;

function validState(s){
 if(!s||s.version!==VERSION||!s.records||typeof s.records!=='object'||Array.isArray(s.records)||!Array.isArray(s.bookmarks))throw Error('형식이 올바르지 않은 백업입니다.');
 const out=fresh();
 for(const [id,r] of Object.entries(s.records)){if(!byId.has(id))continue;if(!r||!['correct','wrong'].includes(r.status)||!Number.isInteger(r.attempts)||r.attempts<1||!Number.isInteger(r.correct)||r.correct<0||r.correct>r.attempts||!Number.isFinite(r.updated))throw Error('학습 기록이 올바르지 않습니다.');out.records[id]={status:r.status,attempts:r.attempts,correct:r.correct,updated:r.updated};}
 out.bookmarks=[...new Set(s.bookmarks.filter(id=>byId.has(id)))];
 if(s.session){const x=s.session;if(!Array.isArray(x.ids)||!x.ids.length||x.ids.length>questions.length||new Set(x.ids).size!==x.ids.length||!x.ids.every(id=>byId.has(id))||!Number.isInteger(x.index)||x.index<0||x.index>x.ids.length||!Array.isArray(x.results)||x.results.length!==x.index||!x.results.every((r,i)=>r&&r.id===x.ids[i]&&['correct','wrong','skip'].includes(r.status)))throw Error('진행 중인 학습 정보가 올바르지 않습니다.');out.session={ids:x.ids,index:x.index,results:x.results.map(r=>({id:r.id,status:r.status,input:String(r.input??'').slice(0,5000)})),input:String(x.input??'').slice(0,5000),revealed:Boolean(x.revealed),started:Number(x.started)||Date.now(),title:String(x.title||'복습').slice(0,200)};}
 if(s.flash){const f=s.flash;if(Array.isArray(f.ids)&&f.ids.length&&f.ids.length<=questions.length&&new Set(f.ids).size===f.ids.length&&f.ids.every(id=>byId.has(id))&&Number.isInteger(f.index)&&f.index>=0&&f.index<=f.ids.length){out.flash={ids:f.ids,index:f.index,revealed:Boolean(f.revealed),title:String(f.title||'플래시카드').slice(0,200)};}}
 return out;
}

// --- validState(s) 함수 끝난 바로 아래에 위치해야 합니다 ---

function persist(syncCloud = true) {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));

  } catch (e) {
    storageOK = false;

  }
  updateNav();

  // 로그인 상태일 때 Firestore 클라우드 동기화
  if (syncCloud && typeof currentUser !== 'undefined' && currentUser) {
    clearTimeout(saveDebounceTimer);
    saveDebounceTimer = setTimeout(async () => {
      try {
        await db.collection('users').doc(currentUser.uid).set({
          ...state,

        }, { merge: true });

}

try{const s=localStorage.getItem(KEY);if(s)state=validState(JSON.parse(s));}catch(e){storageOK=false;}

// --- 이 아래에 Firebase 설정 및 persist 함수가 위치합니다 ---

  storageBucket: "modern-economics.firebasestorage.app",

};

let auth = null, db = null;

try {

// 1. auth 초기화 실패 시 컨테이너 숨김
if (!auth) {

  // 3. 로그인/로그아웃 버튼 클릭 이벤트 등록
  const loginBtn = document.getElementById('google-login-btn');
  if (loginBtn) {

}

// --- 이후 기존 함수들(toast, updateNav, setView, home 등) 유지 ---

function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',4000);}
function updateNav(){const wrong=questions.filter(q=>state.records[q.id]?.status==='wrong').length;$('#wrong-count').textContent=wrong;$('#bookmark-count').textContent=state.bookmarks.length;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));$('.local-badge').innerHTML=storageOK?'<i></i> 이 기기에 자동 저장':'자동 저장 확인 필요';}
function setView(v,html){view=v;$('#main').innerHTML=html;$('#breadcrumb').textContent=({home:'나의 학습 공간',setup:'새로운 학습',flash:'플래시카드로 기억하기',quiz:'집중해서 한 문제씩',result:'이번 학습 돌아보기',wrong:'틀린 문제 다시 보기',bookmarks:'기억해 둘 문제',browse:'전체 문제 살펴보기',settings:'학습 기록과 앱 관리'})[v]||'나의 학습 공간';updateNav();window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true});}
const intro=(eyebrow,title,desc)=>`<div class="intro"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><span class="tag">7개 강의 · 738문항</span></div>`;

 const values=Object.values(state.records),known=values.filter(r=>r.status==='correct').length,wrong=values.filter(r=>r.status==='wrong').length,attempts=values.reduce((a,r)=>a+r.attempts,0),correct=values.reduce((a,r)=>a+r.correct,0),active=state.session&&state.session.index<state.session.ids.length;
 setView('home',intro('YOUR DAILY REVIEW','오늘도, 한 문제씩 확실하게.','강의에서 배운 생각들을 나의 언어로 떠올려 보세요.')+`<section class="hero"><div><div class="eyebrow">${active?'KEEP GOING':'A LITTLE EVERY DAY'}</div><h2>${active?'이어서 기억을 완성해 볼까요?':'기억은 꺼내 볼수록 선명해집니다.'}</h2><p>${active?`${esc(state.session.title)} · ${state.session.index} / ${state.session.ids.length}문항 완료`:'짧게 20문제, 또는 한 강의 전체.<br>지금 나에게 맞는 분량으로 시작하세요.'}</p><div class="row"><button class="btn mint" data-action="${active?'resume':'quick'}">${active?'학습 이어하기':'랜덤 20문제 시작'} <span>↗</span></button><button class="btn ghost" data-action="setup">맞춤 학습</button><button class="btn ghost" data-nav="flash">플래시카드로 공부</button></div></div><div class="hero-mark" aria-hidden="true">Q.</div></section><div class="stats"><div class="stat"><span>풀어 본 문제</span><strong>${values.length} <small>/ 738</small></strong></div><div class="stat"><span>최근 정답</span><strong>${known} <small>문제</small></strong></div><div class="stat"><span>복습할 오답</span><strong>${wrong} <small>문제</small></strong></div><div class="stat"><span>누적 정답률 · 직접 채점</span><strong>${attempts?Math.round(correct/attempts*100):0}<small> %</small></strong></div></div><div class="section-heading"><h2>강의별 학습</h2><small>강의 날짜순 · 전체 7강</small></div><section class="lecture-grid" aria-label="강의별 학습">${lectures.map(l=>{const qs=questions.filter(q=>q.lecture===l.id),n=qs.filter(q=>state.records[q.id]?.status==='correct').length;return `<article class="lecture-card"><div class="lecture-top"><span class="chapter">0${l.id}</span><strong>${esc(l.teacher)}</strong><time>${l.date.replace('2026.','')}</time></div><h3>${esc(l.title)}</h3><div class="progress" aria-label="최근 정답 ${n}/${qs.length}"><span style="width:${n/qs.length*100}%"></span></div><div class="lecture-bottom"><span>${qs.length}문항 · 최근 정답 ${n}</span><button data-lecture="${l.id}">학습하기 ↗</button></div></article>`;}).join('')}</section><p class="note" style="margin-top:20px">단답형·서술형 혼합 자료이므로 정답을 확인한 뒤 직접 채점합니다. 자동 의미 판정은 하지 않습니다.</p>`);
}
function setup(lecture='',pool='all',mode='quiz'){
 setView(mode==='flash'?'flash':'setup',intro('MAKE IT YOURS',mode==='flash'?'플래시카드로 공부하기':'어떻게 복습할까요?',mode==='flash'?'문제와 정답을 한 화면에서 보고, 다시 볼 문제는 복습 표시로 남기세요.':'범위와 분량을 정하면 나만의 퀴즈가 시작됩니다.')+(mode==='flash'&&state.flash&&state.flash.index<state.flash.ids.length?`<div class="panel flash-resume"><p>${esc(state.flash.title)} · ${state.flash.index+1} / ${state.flash.ids.length}번째 카드</p><button class="btn primary" data-action="flash-resume">플래시카드 이어보기</button></div>`:'')+`<form id="setup-form" class="panel"><div class="field" style="margin-bottom:24px"><label for="study-mode">학습 방식</label><select id="study-mode" name="mode"><option value="quiz" ${mode==='quiz'?'selected':''}>퀴즈 · 답변하고 직접 채점</option><option value="flash" ${mode==='flash'?'selected':''}>플래시카드 · 문제와 정답 함께 보기</option></select></div><h2>학습할 강의</h2><div class="row"><button type="button" class="btn" data-action="select-all">전체 선택</button><button type="button" class="btn" data-action="select-none">선택 해제</button></div><div class="lecture-checks">${lectures.map(l=>`<label class="check-row"><input type="checkbox" name="lecture" value="${l.id}" ${!lecture||lecture===l.id?'checked':''}><span>${esc(l.teacher)} · ${esc(l.title)}</span></label>`).join('')}</div><div class="form-grid"><div class="field"><label for="pool">문제 범위</label><select id="pool" name="pool"><option value="all">전체 문제</option><option value="new" ${pool==='new'?'selected':''}>아직 풀지 않은 문제</option><option value="wrong" ${pool==='wrong'?'selected':''}>최근에 틀린 문제</option><option value="bookmarks" ${pool==='bookmarks'?'selected':''}>복습 표시한 문제 (북마크)</option></select></div><div class="field"><label for="count">학습 분량</label><select id="count" name="count"><option value="20">20문제 · 가볍게</option><option value="10">10문제 · 짧게</option><option value="50">50문제 · 집중해서</option><option value="0">선택 범위 전체</option></select></div></div><label class="check-row" style="margin-top:20px"><input type="checkbox" name="shuffle" checked>문제 순서 섞기</label><p class="note" style="margin-top:15px">퀴즈는 정답을 확인한 뒤 직접 채점합니다. 플래시카드는 정답 카드를 눌러 표시·숨기기를 전환하고, 채점 없이 다음 문제로 넘어갑니다. 복습 표시는 북마크에 저장됩니다.</p><div class="actions"><button class="btn primary" type="submit">학습 시작하기 ↗</button><button class="btn" type="button" data-nav="home">돌아가기</button></div></form>`);

async function confirmAction(title,message){return new Promise(resolve=>{const d=document.createElement('dialog');d.innerHTML=`<h2>${esc(title)}</h2><p>${esc(message)}</p><div class="actions"><button class="btn primary" data-ok>계속하기</button><button class="btn" data-cancel>취소</button></div>`;document.body.append(d);let finished=false;const end=value=>{if(finished)return;finished=true;d.close();d.remove();resolve(value);};d.querySelector('[data-ok]').onclick=()=>end(true);d.querySelector('[data-cancel]').onclick=()=>end(false);d.addEventListener('cancel',e=>{e.preventDefault();end(false);});d.showModal();});}
function shuffled(xs){const a=[...xs];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
async function begin(qs,{count=20,shuffle=true,title='전체 강의 복습'}={}){if(!qs.length){toast('선택한 범위에 해당하는 문제가 없습니다.');return;}if(state.session&&state.session.index<state.session.ids.length&&!await confirmAction('새 학습을 시작할까요?','진행 중인 회차는 교체됩니다. 이미 채점한 문제와 북마크 기록은 유지됩니다.'))return;const ids=(shuffle?shuffled(qs):qs).slice(0,count||qs.length).map(q=>q.id);state.session={ids,index:0,results:[],input:'',revealed:false,started:Date.now(),title};persist();quiz();}
function quiz(){const s=state.session;if(!s){home();return;}if(s.index>=s.ids.length){result();return;}const q=byId.get(s.ids[s.index]),l=lectures.find(x=>x.id===q.lecture);setView('quiz',`<div class="session-bar"><button class="btn" data-nav="home">← 잠시 나가기</button><span>${s.index+1} / ${s.ids.length}문제</span></div><div class="progress" role="progressbar" aria-label="학습 진행률" aria-valuemin="0" aria-valuemax="${s.ids.length}" aria-valuenow="${s.index}"><span style="width:${s.index/s.ids.length*100}%"></span></div><section class="panel question-panel"><div class="question-meta"><div><div class="eyebrow">LECTURE 0${q.lecture} · Q${q.number}</div><span>${esc(l.teacher)} · ${l.date}${q.part?`<br>${esc(q.part)}`:''}</span></div>${bookmarkButton(q.id)}</div><h1 class="question-title">${esc(q.question)}</h1><label class="answer-label" for="answer-input">나의 답변 <span>· 입력은 선택 사항입니다</span></label><textarea id="answer-input" maxlength="5000" placeholder="생각나는 핵심어를 적어 보세요." ${s.revealed?'readonly':''}>${esc(s.input)}</textarea>${s.revealed?`<div class="answer-box" aria-live="polite"><span class="tiny-label">자료의 정답</span><p>${esc(q.answer)}</p><small>핵심 내용이 맞는지 비교한 뒤 직접 채점해 주세요.</small></div><div class="grade-row"><button class="btn danger" data-grade="wrong">↻ 다시 공부할게요</button><button class="btn good" data-grade="correct">✓ 맞혔어요</button></div><p class="keyboard-hint">단축키: 1 다시 공부 · 2 맞혔어요</p>`:`<div class="actions"><button class="btn primary" data-action="reveal">정답 확인하기</button><button class="btn" data-action="skip">건너뛰기</button></div><p class="keyboard-hint">답변 입력 중 Ctrl / ⌘ + Enter로 정답 확인</p>`}</section><p class="note">학습 위치와 입력한 답변은 자동 저장됩니다. 건너뛴 문제는 정답률과 오답 노트에 반영되지 않습니다.</p>`);}
function reveal(){if(view!=='quiz'||state.session.revealed)return;state.session.revealed=true;persist();quiz();$('.grade-row button').focus({preventScroll:true});}
function grade(status){const s=state.session;if(view!=='quiz'||!s||s.index>=s.ids.length||(status!=='skip'&&!s.revealed))return;const id=s.ids[s.index];s.results.push({id,status,input:s.input});if(status!=='skip'){const r=state.records[id]||{attempts:0,correct:0};state.records[id]={status,attempts:r.attempts+1,correct:r.correct+(status==='correct'?1:0),updated:Date.now()};}s.index++;s.input='';s.revealed=false;persist();quiz();}
function result(){const s=state.session;if(!s){home();return;}const correct=s.results.filter(r=>r.status==='correct').length,wrong=s.results.filter(r=>r.status==='wrong').length,skipped=s.results.filter(r=>r.status==='skip').length,den=correct+wrong;setView('result',intro('SESSION COMPLETE','한 걸음 더 기억에 가까워졌어요.','틀린 문제를 다시 떠올리는 순간, 기억은 더 단단해집니다.')+`<section class="panel"><div class="results-head"><p>${esc(s.title)} · ${s.ids.length}문항</p><div class="score">${den?Math.round(correct/den*100):0}<small> %</small></div><p>직접 채점한 정답률 · 맞음 ${correct} / 틀림 ${wrong} / 건너뜀 ${skipped}</p><div class="row" style="justify-content:center"><button class="btn primary" data-action="retry" ${wrong+skipped?'':'disabled'}>틀림·건너뜀 다시 풀기</button><button class="btn" data-nav="home">대시보드로</button></div></div></section><div class="section-heading"><h2>이번 회차 돌아보기</h2><small>${s.results.length}문항</small></div><div class="question-list">${s.results.map(r=>{const q=byId.get(r.id);return `<article class="list-item"><div class="list-top"><span>${esc(lectures.find(l=>l.id===q.lecture).teacher)} · ${q.number}번</span><span class="status-pill ${r.status==='wrong'?'wrong':''}">${{correct:'맞음',wrong:'틀림',skip:'건너뜀'}[r.status]}</span></div><h3>${esc(q.question)}</h3><details><summary>내 답변과 정답 확인</summary><p class="note">내 답변: ${esc(r.input||'(입력하지 않음)')}</p><div class="list-answer">${esc(q.answer)}</div></details></article>`;}).join('')}</div>`);}
function list(kind='browse',reset=true){listKind=kind;if(reset){page=1;filter='';search='';}setView(kind,intro(kind==='wrong'?'REVIEW & REMEMBER':kind==='bookmarks'?'SAVE FOR LATER':'QUESTION LIBRARY',kind==='wrong'?'다시 만나면, 맞힐 문제들.':kind==='bookmarks'?'따로 기억해 두고 싶은 것들.':'738개의 질문, 7개의 강의.',kind==='wrong'?'가장 최근에 틀렸다고 채점한 문제입니다. 다시 맞히면 오답 노트에서 빠집니다.':kind==='bookmarks'?'학습 중 별표를 누른 문제를 모았습니다.':'문제와 정답을 검색하고, 강의별로 살펴보세요.')+`<div class="filters"><input type="search" id="search" aria-label="문제 또는 정답 검색" placeholder="문제 또는 정답 검색" value="${esc(search)}"><select id="lecture-filter" aria-label="강의 필터"><option value="">모든 강의</option>${lectures.map(l=>`<option value="${l.id}" ${filter===l.id?'selected':''}>${esc(l.teacher)}</option>`).join('')}</select></div><div class="section-heading"><small id="list-count"></small><div class="row"><button class="btn" data-action="flash-list">이 범위 플래시카드</button><button class="btn primary" data-action="study-list">이 범위 학습하기 ↗</button></div></div><div id="list-content"></div>`);renderList();}
function filtered(){return questions.filter(q=>(listKind!=='wrong'||state.records[q.id]?.status==='wrong')&&(listKind!=='bookmarks'||state.bookmarks.includes(q.id))&&(!filter||q.lecture===filter)&&(!search||(q.question+' '+q.answer).toLocaleLowerCase().includes(search.toLocaleLowerCase())));}
function renderList(){const qs=filtered(),pages=Math.max(1,Math.ceil(qs.length/20));page=Math.min(page,pages);$('#list-count').textContent=`${qs.length}문항`;$('#list-content').innerHTML=qs.length?`<div class="question-list">${qs.slice((page-1)*20,page*20).map(q=>`<article class="list-item"><div class="list-top"><span>${esc(lectures.find(l=>l.id===q.lecture).teacher)} · ${q.number}번 ${state.records[q.id]?`· ${state.records[q.id].status==='correct'?'최근 정답':'최근 오답'}`:''}</span>${bookmarkButton(q.id)}</div><h3>${esc(q.question)}</h3><details><summary>정답 보기</summary><div class="list-answer">${esc(q.answer)}</div></details></article>`).join('')}</div><div class="pager"><button class="btn" data-page="-1" ${page===1?'disabled':''}>← 이전</button><span>${page} / ${pages}</span><button class="btn" data-page="1" ${page===pages?'disabled':''}>다음 →</button></div>`:`<div class="panel empty"><div class="eyebrow">A FRESH START</div><h2>${listKind==='wrong'?'복습할 오답이 없습니다.':listKind==='bookmarks'?'저장한 문제가 없습니다.':'검색 결과가 없습니다.'}</h2><p>강의 필터나 검색어를 바꾸거나 새로운 학습을 시작해 보세요.</p><button class="btn" data-nav="home">대시보드로</button></div>`;}
function settings(){setView('settings',intro('YOUR STUDY, YOUR DATA','학습 기록을 안전하게.','이 기기의 학습 기록을 관리하고 다른 기기로 옮길 수 있습니다.')+`<section class="panel"><div class="settings-block"><h2>기록 백업 · 다른 기기로 옮기기</h2><p>기록은 현재 브라우저에 저장됩니다. PC와 모바일은 자동으로 동기화되지 않습니다. 백업 파일을 내려받아 다른 기기에서 불러오세요. 불러오면 해당 기기의 기존 기록을 교체합니다.</p><div class="row"><button class="btn primary" data-action="export">백업 파일 내려받기</button><button class="btn" data-action="import">백업 불러오기</button><input id="import-file" type="file" accept=".json,application/json" class="hidden"></div><p class="note" style="margin:12px 0 0">개인 정보·로그인·서버 전송 없이 사용합니다. 시크릿 모드나 브라우저 데이터 삭제 시 기록이 사라질 수 있습니다.</p></div><div class="settings-block"><h2>앱처럼 사용하기</h2><p>GitHub Pages 주소로 접속한 뒤 Android/PC Chrome·Edge에서는 ‘앱 설치’를, iPhone Safari에서는 공유 메뉴의 ‘홈 화면에 추가’를 사용하세요. 처음 온라인으로 연 뒤에는 오프라인 복습도 가능합니다.</p><button class="btn" data-action="install" ${installPrompt?'':'disabled'}>${installPrompt?'이 기기에 앱 설치':'브라우저 메뉴에서 설치 / 홈 화면에 추가'}</button><p class="note" style="margin:12px 0 0">HTML 파일을 직접 열면 퀴즈는 작동하지만, 앱 설치와 오프라인 캐시는 HTTPS 배포 주소에서 지원됩니다.</p></div><div class="settings-block"><h2>문제 자료에 관하여</h2><p>2026년 10월 17일자 「현대경제강독 단답형 예상문제」의 7개 강의, 738문항을 변환했습니다. 정답·보충 설명·강의 당시 수치를 보존했으며, 별도 사실 검증이나 최신 수치 갱신을 하지 않았습니다. 굵은 글씨 서식이 없는 텍스트 자료이므로 핵심어 자동 판정 대신 직접 채점을 사용합니다.</p></div><div class="settings-block"><h2>기록 초기화</h2><p>현재 기기의 학습 결과, 북마크, 진행 중인 회차를 모두 지웁니다. 먼저 백업을 내려받는 것을 권합니다.</p><button class="btn danger" data-action="reset">학습 기록 모두 초기화</button></div></section>`);}
async function beginFlash(qs,{count=20,shuffle=true,title='전체 강의 플래시카드'}={}){
 if(!qs.length){toast('선택한 범위에 해당하는 문제가 없습니다.');return;}
 if(state.flash&&state.flash.index<state.flash.ids.length&&!await confirmAction('새 플래시카드를 시작할까요?','현재 카드 회차가 새 범위로 바뀝니다. 복습 표시와 퀴즈 기록은 유지됩니다.'))return;
 state.flash={ids:(shuffle?shuffled(qs):qs).slice(0,count||qs.length).map(q=>q.id),index:0,revealed:false,title};persist();flashcard();
}
function flashcard(){
 const f=state.flash;if(!f){setup('','all','flash');return;}
 if(f.index>=f.ids.length){const n=f.ids.filter(id=>state.bookmarks.includes(id)).length;setView('flash',intro('CARDS COMPLETE','이번 카드를 모두 살펴봤습니다.',`${f.ids.length}문제 중 ${n}문제에 복습 표시가 있습니다.`)+`<section class="panel"><h2>다시 기억해 볼까요?</h2><p class="note">플래시카드 학습은 정답률과 오답 기록에 반영되지 않습니다. 복습 표시한 문제는 북마크에서 다시 볼 수 있습니다.</p><div class="actions"><button class="btn primary" data-action="flash-review" ${state.bookmarks.length?'':'disabled'}>복습 표시한 카드 모아보기 (${state.bookmarks.length})</button><button class="btn" data-action="flash-restart">이번 카드 처음부터</button><button class="btn" data-action="flash-prev">마지막 카드로</button><button class="btn" data-nav="flash">새 범위 선택</button><button class="btn" data-nav="home">대시보드로</button></div></section>`);return;}
 const q=byId.get(f.ids[f.index]),l=lectures.find(x=>x.id===q.lecture),saved=state.bookmarks.includes(q.id);
 setView('flash',`<div class="session-bar"><button class="btn" data-nav="flash">← 범위 / 이어보기</button><span aria-live="polite">${f.index+1} / ${f.ids.length} 카드</span></div><div class="progress" role="progressbar" aria-label="플래시카드 진행률" aria-valuemin="0" aria-valuemax="${f.ids.length}" aria-valuenow="${f.index}"><span style="width:${f.index/f.ids.length*100}%"></span></div><div class="question-meta" style="margin-top:22px"><div><div class="eyebrow">LECTURE 0${q.lecture} · Q${q.number}</div><span>${esc(l.teacher)} · ${l.date}${q.part?`<br>${esc(q.part)}`:''}</span></div><button class="bookmark-btn ${saved?'saved':''}" data-action="flash-mark" aria-pressed="${saved}">${saved?'★ 복습 표시됨':'☆ 복습할 문제'}</button></div><div class="flash-grid"><section class="panel flash-card"><div class="flash-card-label">문제</div><h1 class="question-title flash-question">${esc(q.question)}</h1></section><button type="button" class="flash-card flash-answer" id="flash-answer" data-action="flash-toggle" aria-expanded="${f.revealed}" aria-controls="flash-answer-content"><span class="flash-card-label">자료의 정답</span><span id="flash-answer-content" class="flash-answer-text" ${f.revealed?'':'hidden'}>${esc(q.answer)}</span><span id="flash-answer-placeholder" class="muted" ${f.revealed?'hidden':''}>정답을 떠올린 뒤 카드를 눌러 확인하세요.</span><span class="flash-answer-hint">${f.revealed?'카드를 다시 누르면 정답이 숨겨집니다.':'카드를 누르면 정답이 나타납니다.'}</span></button></div><div class="flash-actions"><button class="btn" data-action="flash-prev" ${f.index===0?'disabled':''}>← 이전 문제</button><button class="btn" data-action="flash-save-next">★ 복습으로 남기고 다음</button><button class="btn primary" data-action="flash-next">${f.index===f.ids.length-1?'학습 마치기 ✓':'다음 문제 →'}</button></div><p class="note" style="margin-top:18px">복습 표시는 북마크에도 저장됩니다. 카드가 바뀌면 정답은 다시 숨겨집니다. 카드 위치와 복습 표시는 자동 저장됩니다.</p><p class="keyboard-hint">← / → 이전·다음 · Space 정답 표시·숨기기 · B 복습 표시</p>`);
}
function toggleFlashAnswer(){const f=state.flash;if(!f||f.index>=f.ids.length||!$('#flash-answer'))return;f.revealed=!f.revealed;const b=$('#flash-answer');b.setAttribute('aria-expanded',String(f.revealed));$('#flash-answer-content').hidden=!f.revealed;$('#flash-answer-placeholder').hidden=f.revealed;b.querySelector('.flash-answer-hint').textContent=f.revealed?'카드를 다시 누르면 정답이 숨겨집니다.':'카드를 누르면 정답이 나타납니다.';persist();}
function moveFlash(delta){const f=state.flash;if(!f)return;f.index=Math.max(0,Math.min(f.ids.length,f.index+delta));f.revealed=false;persist();flashcard();}
function markFlash(keep=false){const f=state.flash;if(!f||f.index>=f.ids.length)return;const id=f.ids[f.index],saved=state.bookmarks.includes(id);if(keep&&!saved)state.bookmarks.push(id);else if(!keep)state.bookmarks=saved?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];persist();const b=document.querySelector('[data-action="flash-mark"]');if(b){const marked=state.bookmarks.includes(id);b.classList.toggle('saved',marked);b.setAttribute('aria-pressed',String(marked));b.textContent=marked?'★ 복습 표시됨':'☆ 복습할 문제';}}
document.addEventListener('keydown',e=>{if(view!=='flash'||!$('#flash-answer')||e.isComposing||e.repeat||e.ctrlKey||e.metaKey||e.altKey||document.querySelector('dialog[open]')||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowLeft'){e.preventDefault();moveFlash(-1);}else if(e.key==='ArrowRight'){e.preventDefault();moveFlash(1);}else if(e.key.toLowerCase()==='b'){e.preventDefault();markFlash();}else if(e.code==='Space'&&!['BUTTON','A'].includes(document.activeElement?.tagName)){e.preventDefault();toggleFlashAnswer();}});

function navigate(v){if(v==='flash')setup('','all','flash');else if(v==='home')home();else if(v==='settings')settings();else list(v);}
document.addEventListener('click',async e=>{
 const b=e.target.closest('button,a[data-nav]');if(!b||b.disabled)return;
 if(b.dataset.nav){e.preventDefault();navigate(b.dataset.nav);return;}
 if(b.dataset.lecture){setup(b.dataset.lecture);return;}
 if(b.dataset.bookmark){const id=b.dataset.bookmark;state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];persist();if(['browse','wrong','bookmarks'].includes(view))renderList();else{b.outerHTML=bookmarkButton(id);}return;}
 if(b.dataset.grade){grade(b.dataset.grade);return;}
 if(b.dataset.page){page+=Number(b.dataset.page);renderList();window.scrollTo({top:0,behavior:'instant'});return;}
 switch(b.dataset.action){case 'flash-resume':flashcard();break;case 'flash-toggle':toggleFlashAnswer();break;case 'flash-prev':moveFlash(-1);break;case 'flash-next':moveFlash(1);break;case 'flash-mark':markFlash();break;case 'flash-save-next':markFlash(true);moveFlash(1);break;case 'flash-restart':if(state.flash){state.flash.index=0;state.flash.revealed=false;persist();flashcard();}break;case 'flash-review':await beginFlash(questions.filter(q=>state.bookmarks.includes(q.id)),{count:0,shuffle:false,title:'복습 표시한 카드'});break;case 'flash-list':await beginFlash(filtered(),{count:0,shuffle:false,title:({wrong:'오답 노트',bookmarks:'복습 표시',browse:'선택 범위'})[listKind]+' 플래시카드'});break;case 'setup':setup();break;case 'quick':await begin(questions);break;case 'resume':quiz();break;case 'select-all':case 'select-none':document.querySelectorAll('[name=lecture]').forEach(x=>x.checked=b.dataset.action==='select-all');break;case 'reveal':reveal();break;case 'skip':grade('skip');break;case 'retry':await begin(state.session.results.filter(r=>r.status!=='correct').map(r=>byId.get(r.id)),{count:0,title:'틀림·건너뜀 복습'});break;case 'study-list':await begin(filtered(),{count:0,title:({wrong:'오답 노트 복습',bookmarks:'북마크 복습',browse:'선택 범위 복습'})[listKind]});break;case 'export':{const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`econ-study-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('학습 기록 백업을 내려받았습니다.');break;}case 'import':$('#import-file').click();break;case 'reset':if(await confirmAction('모든 기록을 초기화할까요?','이 기기의 결과, 북마크, 진행 중인 학습이 모두 삭제됩니다. 되돌리려면 백업 파일이 필요합니다.')){state=fresh();persist();home();toast('학습 기록을 초기화했습니다.');}break;case 'install':if(installPrompt){await installPrompt.prompt();installPrompt=null;settings();}break;}
});
document.addEventListener('submit',async e=>{if(e.target.id!=='setup-form')return;e.preventDefault();const f=new FormData(e.target),ls=f.getAll('lecture');if(!ls.length){toast('강의를 한 개 이상 선택해 주세요.');return;}const pool=f.get('pool');const qs=questions.filter(q=>ls.includes(q.lecture)&&(pool!=='new'||!state.records[q.id])&&(pool!=='wrong'||state.records[q.id]?.status==='wrong')&&(pool!=='bookmarks'||state.bookmarks.includes(q.id)));await (f.get('mode')==='flash'?beginFlash:begin)(qs,{count:Number(f.get('count')),shuffle:f.has('shuffle'),title:ls.length===1?lectures.find(l=>l.id===ls[0]).teacher+' 강의 복습':`${ls.length}개 강의 복습`});});
document.addEventListener('input',e=>{if(e.target.id==='answer-input'&&state.session&&!state.session.revealed){state.session.input=e.target.value;persist();}if(e.target.id==='search'){search=e.target.value.trim();page=1;renderList();}});
document.addEventListener('change',async e=>{if(e.target.id==='lecture-filter'){filter=e.target.value;page=1;renderList();}if(e.target.id==='import-file'){const file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('백업 파일은 5MB 이하여야 합니다.');const incoming=validState(JSON.parse(await file.text()));if(await confirmAction('백업 기록으로 교체할까요?',`불러올 기록: ${Object.keys(incoming.records).length}문항, 북마크 ${incoming.bookmarks.length}개. 현재 기기의 기록이 교체됩니다.`)){state=incoming;persist();home();toast('백업 기록을 불러왔습니다.');}}catch(err){toast(err instanceof SyntaxError?'JSON 백업 파일을 확인해 주세요.':err.message);}e.target.value='';}});
document.addEventListener('keydown',e=>{if(e.isComposing||e.repeat||view!=='quiz'||document.querySelector('dialog[open]'))return;const typing=['TEXTAREA','INPUT','SELECT'].includes(document.activeElement?.tagName);if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();reveal();}else if(!typing&&state.session.revealed&&['1','2'].includes(e.key)){e.preventDefault();grade(e.key==='1'?'wrong':'correct');}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(view==='settings')settings();});
window.addEventListener('storage',e=>{if(e.key===KEY)toast('다른 탭에서 기록이 변경되었습니다. 최신 기록을 사용하려면 새로고침해 주세요.');});
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
home();if(!storageOK)toast('저장된 기록을 읽지 못했습니다. 백업 파일이나 브라우저 저장 설정을 확인해 주세요.');
})();
</script></body></html>
